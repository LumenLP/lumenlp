[workspace]
resolver = "2"
members = [
  "crates/metrics",
  "crates/dex",
  "crates/api-server",
  "crates/snapshotter",
  "crates/pool-indexer",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"

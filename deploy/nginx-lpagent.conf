# api.lumenlp.xyz — Cloudflare Origin SSL (Full / Full Strict)
# Cert covers *.lumenlp.xyz + lumenlp.xyz
#
# CORS is handled by api-server (tower-http CorsLayer). Do not add
# Access-Control-* here or browsers see duplicate values like "*, *".

server {
    listen 80;
    server_name api.lumenlp.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.lumenlp.xyz;

    ssl_certificate     /etc/nginx/ssl/lumenlp.pem;
    ssl_certificate_key /etc/nginx/ssl/lumenlp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
